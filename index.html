<title>اختبار البريد الإلكتروني | Email Quiz – Mohtarf</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#2b2d5c;background:linear-gradient(135deg,#ffe29f,#ffa99f 35%,#a18cd1 70%,#5ee7df);background-size:300% 300%;animation:bg 14s ease infinite;overflow-x:hidden}
@keyframes bg{50%{background-position:100% 100%}}
.fl{position:fixed;top:105vh;font-size:30px;opacity:.5;animation:up linear infinite;pointer-events:none}
@keyframes up{to{top:-10vh;transform:rotate(360deg)}}
.w{max-width:760px;margin:0 auto;padding:14px;position:relative}
.top{text-align:center}.top img{width:120px;height:120px;border-radius:50%;background:#fff;box-shadow:0 6px 18px #0003;animation:pop 1.2s}
h1{margin:6px 0;font-size:28px}h1 small{display:block;font-size:17px;color:#fff;direction:ltr}
.card{background:#fffffff2;border-radius:24px;padding:20px;box-shadow:0 10px 30px #0003;margin-top:12px}
input{width:100%;font-size:24px;padding:14px;border-radius:16px;border:3px solid #a18cd1;text-align:center;font-family:inherit}
.btn{display:block;width:100%;margin-top:14px;padding:16px;font-size:24px;font-weight:700;color:#fff;border:0;border-radius:18px;background:linear-gradient(90deg,#ff6b6b,#ff9f43);cursor:pointer;box-shadow:0 6px 0 #c0392b;font-family:inherit}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c0392b}
.bar{height:16px;background:#ddd;border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00b894,#fdcb6e,#ff7675);transition:width .5s}
.row{display:flex;justify-content:space-between;font-weight:700;font-size:18px}
.tag{display:inline-block;background:#6c5ce7;color:#fff;border-radius:20px;padding:3px 14px;font-size:15px}
.qa{font-size:27px;font-weight:800;margin:12px 0 4px;line-height:1.5}
.qe{font-size:20px;color:#6c5ce7;direction:ltr;text-align:left;margin-bottom:12px;font-weight:600}
.op{display:block;width:100%;margin:9px 0;padding:13px;border-radius:16px;border:3px solid;font-family:inherit;cursor:pointer;background:#fff;text-align:right;transition:.2s}
.op b{display:block;font-size:24px}.op span{display:block;font-size:18px;direction:ltr;text-align:left;opacity:.8}
.op:nth-of-type(4n+1){border-color:#ff7675}.op:nth-of-type(4n+2){border-color:#fdcb6e}.op:nth-of-type(4n+3){border-color:#55efc4}.op:nth-of-type(4n){border-color:#74b9ff}
.op:hover{transform:scale(1.02)}
.op.sel{background:#dfe6ff}.op.ok{background:#55efc4!important;border-color:#00b894!important;animation:pop .5s}
.op.no{background:#ff7675!important;color:#fff;animation:shake .5s}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.fb{font-size:26px;font-weight:800;text-align:center;margin-top:8px;min-height:36px}
.p{position:fixed;font-size:32px;pointer-events:none;z-index:9;animation:fall 1.8s ease-out forwards}
@keyframes fall{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
.big{font-size:80px;text-align:center}.hide{display:none}
</style></head><body>
